name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.2.3 or v1.2.3)"
        required: true
        type: string
      reviewed_sha:
        description: "Optional exact reviewed main SHA supplied by release.sh"
        required: false
        type: string

permissions:
  contents: write

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      release_channel: ${{ steps.meta.outputs.release_channel }}
      previous_tag: ${{ steps.previous_tag.outputs.previous_tag }}
      ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Confirm release target is current main
        env:
          EVENT_NAME: ${{ github.event_name }}
          REVIEWED_SHA: ${{ github.event.inputs.reviewed_sha }}
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
            echo "Release target must exactly match the current origin/main SHA." >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$REVIEWED_SHA" ]]; then
            if [[ ! "$REVIEWED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Reviewed SHA must be a complete lowercase Git SHA-1." >&2
              exit 1
            fi
            if [[ "$(git rev-parse HEAD)" != "$REVIEWED_SHA" ]]; then
              echo "Release target no longer matches the locally reviewed SHA $REVIEWED_SHA." >&2
              exit 1
            fi
          fi

      - name: Ensure Electron runtime is installed
        run: |
          if ! node -e "require('./apps/desktop/node_modules/electron')" >/dev/null 2>&1; then
            rm -rf apps/desktop/node_modules/electron/dist apps/desktop/node_modules/electron/path.txt
            bun apps/desktop/node_modules/electron/install.js
          fi
          node -e "require('./apps/desktop/node_modules/electron')"

      - id: meta
        name: Resolve release version
        shell: bash
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw="$DISPATCH_VERSION"
          else
            raw="$TAG_VERSION"
          fi

          version="${raw#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $raw" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "release_name=GedCode v$version" >> "$GITHUB_OUTPUT"

          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$version" =~ -nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "release_channel=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "release_channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Format check
        run: bun run fmt:check

      - name: Verify release package versions
        run: bun run release:versions:check

      - name: Verify release metadata tooling
        run: bun run release:smoke

      - name: Audit production dependencies
        run: bun run release:audit

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Install browser test runtime
        run: bun run --filter=@t3tools/web test:browser:install

      - name: Browser tests
        run: bun run --filter=@t3tools/web test:browser

      - id: previous_tag
        name: Resolve previous release tag
        run: |
          node scripts/resolve-previous-release-tag.ts \
            --channel "${{ steps.meta.outputs.release_channel }}" \
            --current-tag "${{ steps.meta.outputs.tag }}" \
            --github-output

  build:
    name: Build ${{ matrix.label }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - label: Linux x64
            runner: ubuntu-latest
            platform: linux
            target: AppImage
            arch: x64
          - label: Windows x64
            runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Install Spectre-mitigated MSVC libs
        if: matrix.platform == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = & $vswhere -products * -latest -property installationPath
          $setupExe = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setupExe `
            -ArgumentList "modify", "--installPath", "`"$installPath`"", "--add", `
            "Microsoft.VisualStudio.Component.VC.Tools.x86.x64.Spectre", "--quiet", "--norestart" `
            -Wait -PassThru -NoNewWindow
          if ($null -eq $proc -or $proc.ExitCode -ne 0) {
            $code = if ($null -ne $proc) { $proc.ExitCode } else { 1 }
            Write-Error "Visual Studio Installer failed with exit code $code"
            exit $code
          }

      - name: Install ImageMagick
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          if ! command -v magick >/dev/null 2>&1 && ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          if command -v magick >/dev/null 2>&1; then
            magick -version
          else
            convert -version
          fi

      - name: Prepare Azure Trusted Signing
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $ErrorActionPreference = "Stop"

          $requiredSecrets = @(
            $env:AZURE_TENANT_ID,
            $env:AZURE_CLIENT_ID,
            $env:AZURE_CLIENT_SECRET,
            $env:AZURE_TRUSTED_SIGNING_ENDPOINT,
            $env:AZURE_TRUSTED_SIGNING_ACCOUNT_NAME,
            $env:AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME,
            $env:AZURE_TRUSTED_SIGNING_PUBLISHER_NAME
          )
          if ($requiredSecrets | Where-Object { [string]::IsNullOrWhiteSpace($_) }) {
            Write-Host "Azure Trusted Signing disabled; skipping TrustedSigning module preparation."
            exit 0
          }

          try {
            Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force `
              -Scope CurrentUser `
              -ErrorAction Stop
          } catch {
            Write-Warning "Could not bootstrap NuGet package provider. Continuing because the runner may already have a usable provider. $($_.Exception.Message)"
          }

          Install-Module `
            -Name TrustedSigning `
            -MinimumVersion 0.5.0 `
            -Force `
            -AllowClobber `
            -Repository PSGallery `
            -Scope CurrentUser `
            -ErrorAction Stop

          Import-Module TrustedSigning -MinimumVersion 0.5.0 -Force
          Get-Command Invoke-TrustedSigning -ErrorAction Stop

          $moduleRoots = @(
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "PowerShell", "Modules"),
            [System.IO.Path]::Combine([Environment]::GetFolderPath("MyDocuments"), "WindowsPowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "PowerShell", "Modules"),
            [System.IO.Path]::Combine($env:ProgramFiles, "WindowsPowerShell", "Modules")
          )
          $modulePathEntries = @($moduleRoots + ($env:PSModulePath -split ";")) |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -Unique
          "PSModulePath=$($modulePathEntries -join ';')" >> $env:GITHUB_ENV

      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.preflight.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"
              echo "macOS signing enabled."
              echo "T3CODE_MAC_SIGNED=true" >> "$GITHUB_ENV"
              args+=(--signed)
            else
              echo "macOS signing disabled; building ad-hoc signed artifacts."
              echo "T3CODE_MAC_SIGNED=false" >> "$GITHUB_ENV"
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "$AZURE_TENANT_ID" \
              "$AZURE_CLIENT_ID" \
              "$AZURE_CLIENT_SECRET" \
              "$AZURE_TRUSTED_SIGNING_ENDPOINT" \
              "$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" \
              "$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" \
              "$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing one or more Azure Trusted Signing secrets)."
            fi
          else
            echo "Signing disabled for ${{ matrix.platform }}."
          fi

          bun run dist:desktop:artifact -- "${args[@]}"

      - name: Smoke test desktop startup
        if: matrix.platform == 'linux'
        run: xvfb-run -a bun run test:desktop-smoke

      - name: Verify macOS artifact signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          set -euo pipefail

          app_zip="$(find release -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          dmg="$(find release -maxdepth 1 -type f -name '*.dmg' | head -n 1)"
          if [[ -z "$app_zip" || -z "$dmg" ]]; then
            echo "Missing macOS zip or dmg release artifact." >&2
            exit 1
          fi

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          ditto -x -k "$app_zip" "$tmp_dir"
          app_path="$(find "$tmp_dir" -maxdepth 3 -type d -name '*.app' | head -n 1)"
          if [[ -z "$app_path" ]]; then
            echo "Could not find .app inside macOS updater zip." >&2
            exit 1
          fi

          verify_app_signature() {
            local path="$1"
            codesign --verify --deep --strict --verbose=2 "$path"
            local signature_details
            signature_details="$(codesign -dv --verbose=4 "$path" 2>&1)"
            echo "$signature_details"
            if ! grep -q "Identifier=com.t3tools.gedcode" <<<"$signature_details"; then
              echo "macOS app bundle identifier is not com.t3tools.gedcode." >&2
              exit 1
            fi
            if ! grep -q "Sealed Resources version=" <<<"$signature_details"; then
              echo "macOS app is missing sealed resources and will be reported as damaged." >&2
              exit 1
            fi
            if [[ "${T3CODE_MAC_SIGNED:-false}" != "true" ]] && ! grep -q "Signature=adhoc" <<<"$signature_details"; then
              echo "Unsigned macOS release artifacts must still have a valid ad-hoc signature." >&2
              exit 1
            fi
          }

          verify_app_signature "$app_path"

          sparkle_framework="$app_path/Contents/Frameworks/Sparkle.framework"
          sparkle_addon="$(find "$app_path/Contents/Resources/app.asar.unpacked" -type f -name 'sparkle_bridge.node' | head -n 1)"
          if [[ ! -d "$sparkle_framework" || -z "$sparkle_addon" ]]; then
            echo "macOS app is missing the Sparkle framework or native Electron bridge." >&2
            exit 1
          fi
          if [[ "$(plutil -extract SUPublicEDKey raw -o - "$app_path/Contents/Info.plist")" != "OEqTyWgHzGWLdI/c38qOQw+fwKdK+npBmpSEum8e4U4=" ]]; then
            echo "macOS app contains an unexpected Sparkle public key." >&2
            exit 1
          fi
          plutil -extract SUFeedURL raw -o - "$app_path/Contents/Info.plist" | grep -q '/sparkle-feed/appcast-'
          otool -L "$sparkle_addon" | grep -q 'Sparkle.framework'
          codesign --verify --deep --strict --verbose=2 "$sparkle_framework"

          mount_dir="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_dir" "$dmg"
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true; rm -rf "$tmp_dir" "$mount_dir"' EXIT
          dmg_app_path="$(find "$mount_dir" -maxdepth 2 -type d -name '*.app' | head -n 1)"
          if [[ -z "$dmg_app_path" ]]; then
            echo "Could not find .app inside macOS DMG." >&2
            exit 1
          fi
          verify_app_signature "$dmg_app_path"

          if [[ "${T3CODE_MAC_SIGNED:-false}" == "true" ]]; then
            spctl --assess --type execute --verbose=4 "$app_path"
            spctl --assess --type execute --verbose=4 "$dmg_app_path"
            xcrun stapler validate "$app_path"
            xcrun stapler validate "$dmg_app_path"
            xcrun stapler validate "$dmg"
          fi

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish

          version="${{ needs.preflight.outputs.version }}"
          if [[ "${{ needs.preflight.outputs.release_channel }}" == "stable" ]]; then
            manifest_prefix="latest"
          else
            manifest_prefix="nightly"
          fi

          case "${{ matrix.platform }}" in
            mac)
              assets=(
                "release/GedCode-$version-arm64.dmg"
                "release/GedCode-$version-arm64.zip"
              )
              ;;
            linux)
              assets=(
                "release/GedCode-$version-x86_64.AppImage"
                "release/$manifest_prefix-linux.yml"
              )
              ;;
            win)
              assets=(
                "release/GedCode-$version-x64.exe"
                "release/GedCode-$version-x64.exe.blockmap"
                "release/$manifest_prefix.yml"
              )
              ;;
            *)
              echo "Unsupported release platform: ${{ matrix.platform }}" >&2
              exit 1
              ;;
          esac

          for file in "${assets[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "Missing required ${{ matrix.platform }} release artifact: $file" >&2
              exit 1
            fi
            cp "$file" release-publish/
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  sparkle_feed:
    name: Generate signed Sparkle feed
    needs: [preflight, build]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' }}
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download macOS release archive
        uses: actions/download-artifact@v4
        with:
          name: desktop-mac-arm64
          path: mac-release-assets

      - name: Fetch pinned Sparkle release tools
        run: bash apps/desktop/node_modules/electron-sparkle-updater/native/scripts/fetch-sparkle.sh

      - name: Generate and verify signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.preflight.outputs.release_channel }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "stable" ]]; then
            sparkle_channel="latest"
          else
            sparkle_channel="nightly"
          fi
          node scripts/generate-sparkle-feed.ts \
            --tag "$RELEASE_TAG" \
            --channel "$sparkle_channel" \
            --release-assets-dir mac-release-assets \
            --output-dir sparkle-feed \
            --sparkle-bin apps/desktop/node_modules/electron-sparkle-updater/native/vendor/bin

      - name: Upload signed Sparkle feed
        uses: actions/upload-artifact@v4
        with:
          name: sparkle-feed-${{ needs.preflight.outputs.release_channel }}
          path: sparkle-feed/*.xml
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [preflight, build, sparkle_feed]
    if: ${{ !failure() && !cancelled() && needs.preflight.result == 'success' && needs.build.result == 'success' && needs.sparkle_feed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@t3tools/scripts

      - name: Download all desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download signed Sparkle feed
        uses: actions/download-artifact@v4
        with:
          name: sparkle-feed-${{ needs.preflight.outputs.release_channel }}
          path: sparkle-feed

      - name: Publish stable updater manifests to nightly channel
        if: needs.preflight.outputs.is_prerelease == 'false'
        run: node scripts/promote-stable-update-manifests.ts --release-assets-dir release-assets

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/publish-github-release.ts \
            --tag "${{ needs.preflight.outputs.tag }}" \
            --version "${{ needs.preflight.outputs.version }}" \
            --channel "${{ needs.preflight.outputs.release_channel }}" \
            --target "${{ needs.preflight.outputs.ref }}" \
            --name "${{ needs.preflight.outputs.release_name }}" \
            --previous-tag "${{ needs.preflight.outputs.previous_tag }}" \
            --prerelease "${{ needs.preflight.outputs.is_prerelease }}" \
            --make-latest "${{ needs.preflight.outputs.make_latest }}" \
            --release-assets-dir release-assets

      - name: Publish durable Sparkle feed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: ${{ needs.preflight.outputs.ref }}
        run: |
          if ! gh release view sparkle-feed >/dev/null 2>&1; then
            gh release create sparkle-feed \
              --target "$RELEASE_TARGET" \
              --title "GedCode Sparkle update feeds" \
              --notes "Machine-managed signed update feeds for GedCode macOS releases." \
              --prerelease \
              --latest=false
          fi
          gh release upload sparkle-feed sparkle-feed/*.xml --clobber

  finalize:
    name: Finalize release
    needs: [preflight, release]
    if: needs.preflight.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile --filter=@t3tools/scripts

      - name: Reconcile version bump onto current main
        env:
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
          RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git checkout -B release-finalize origin/main

            node scripts/update-release-package-versions.ts "$RELEASE_VERSION" --preserve-newer
            if git diff --quiet -- apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock; then
              if bun run release:versions:check; then
                echo "Main already records $RELEASE_VERSION or a newer version with synchronized lock metadata."
                exit 0
              fi
              echo "Package versions are current, but bun.lock workspace metadata needs repair."
            fi

            bunx oxfmt apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json
            bun run release:versions:check

            git add apps/server/package.json apps/desktop/package.json apps/web/package.json packages/contracts/package.json bun.lock
            git commit -m "chore(release): prepare $RELEASE_TAG" -m "Record the published stable version in every releasable package and synchronize Bun workspace metadata. The release tag remains pinned to the SHA that was built and published."
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Main moved while finalizing $RELEASE_TAG; retrying from the new tip ($attempt/5)." >&2
          done

          echo "Could not finalize $RELEASE_TAG after five concurrent-main retries." >&2
          exit 1
